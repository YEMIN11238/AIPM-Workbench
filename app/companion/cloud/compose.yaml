name: aipm-dafeiyu

services:
  astrbot:
    # Official release tags and registry index digests verified 2026-10-25.
    image: soulter/astrbot:v4.29.3@sha256:c93a6d19507ba45474c3dfb82aad9d36eb432a478112f13c7e6325b5ebffc5f2
    platform: linux/amd64
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6185:6185"
    expose:
      - "6199"
    volumes:
      - ./private/astrbot-data:/AstrBot/data
    networks:
      - companion
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  snowluma:
    image: motricseven7/snowluma:v2.2.0@sha256:34b4ec03738a698231cbad39c5650747330f5a96d953494fb6c12e1273974c0b
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - astrbot
    shm_size: 1gb
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      TZ: Asia/Shanghai
      SNOWLUMA_UID: "1000"
      SNOWLUMA_GID: "1000"
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: "5099"
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_QQ_FLAGS: --disable-gpu --disable-software-rasterizer --disable-gpu-compositing
    ports:
      - "127.0.0.1:5099:5099"
      - "127.0.0.1:6081:6081"
    volumes:
      - ./private/snowluma-data:/app/data
      - ./private/qq-client-config:/app/.config
      - ./private/qq-client-data:/app/.local/share
    networks:
      - companion
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  companion:
    driver: bridge
